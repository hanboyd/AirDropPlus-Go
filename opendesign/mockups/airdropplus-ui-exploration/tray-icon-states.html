<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AirDropPlus-Go — Tray Icon States</title>
  <style>
    @font-face { font-family: "Charter"; src: url("../../../assets/fonts/CharterBT-Roman.otf"); }
    :root { --paper:#f4f1e9; --ink:#263648; --muted:#aeafab; --green:#34c759; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; color:var(--ink); background:var(--paper); font-family:"TsangerJinKai02",serif; }
    main { width:min(900px,calc(100vw - 40px)); }
    h1 { margin:0 0 10px; font:42px/1.1 Charter,serif; letter-spacing:-.02em; }
    .lead { margin:0 0 40px; color:#6e706e; font-size:18px; }
    .states { display:grid; grid-template-columns:repeat(2,1fr); gap:24px; }
    .state { padding:28px; background:rgba(255,255,255,.62); border:1px solid rgba(38,54,72,.12); border-radius:24px; }
    .state h2 { margin:20px 0 6px; font-size:22px; font-weight:500; }
    .state p { margin:0; color:#767873; }
    .icon { width:128px; height:128px; display:block; filter:drop-shadow(0 8px 16px rgba(38,54,72,.16)); }
    .taskbar { margin-top:28px; height:64px; padding:0 22px; display:flex; align-items:center; justify-content:flex-end; gap:18px; color:white; background:rgba(28,30,34,.92); border:1px solid rgba(255,255,255,.15); border-radius:18px; box-shadow:0 18px 40px rgba(38,54,72,.18); backdrop-filter:blur(18px); }
    .tray-icon { width:28px; height:28px; }
    .taskbar span { color:#d6d7d8; font:14px Charter,serif; }
    svg { overflow:visible; }
    @media(max-width:620px){ h1{font-size:34px}.states{grid-template-columns:1fr}.state{display:grid;grid-template-columns:96px 1fr;column-gap:20px}.icon{width:96px;height:96px;grid-row:1/3}.state h2{margin:14px 0 4px} }
  </style>
</head>
<body>
  <main>
    <h1>One icon. Two quiet states.</h1>
    <p class="lead">只有最新一次手机 Send 改变状态；点击图标查看后立即复位。</p>
    <section class="states">
      <article class="state">
        <svg class="icon" viewBox="0 0 32 32" aria-label="空闲状态图标">
          <rect x="2" y="2" width="28" height="28" rx="7" fill="#263648" />
          <rect x="9" y="6" width="14" height="21" rx="4" fill="#fff" />
          <rect x="11" y="8" width="10" height="15.5" rx="2" fill="#263648" />
          <circle cx="16" cy="25" r="1" fill="#263648" />
          <circle cx="24" cy="24" r="6" fill="#fff" />
          <circle cx="24" cy="24" r="4.1" fill="#aeafab" />
        </svg>
        <h2>未收到</h2>
        <p>中性灰灯。程序正常待命，不表达连接质量。</p>
      </article>
      <article class="state">
        <svg class="icon" viewBox="0 0 32 32" aria-label="已收到状态图标">
          <rect x="2" y="2" width="28" height="28" rx="7" fill="#263648" />
          <rect x="9" y="6" width="14" height="21" rx="4" fill="#fff" />
          <rect x="11" y="8" width="10" height="15.5" rx="2" fill="#263648" />
          <circle cx="16" cy="25" r="1" fill="#263648" />
          <circle cx="24" cy="24" r="6" fill="#fff" />
          <circle cx="24" cy="24" r="4.1" fill="#34c759" />
        </svg>
        <h2>已收到最新 Send</h2>
        <p>Apple 绿色状态灯。不会自动展开，不闪烁、不累计。</p>
      </article>
    </section>
    <div class="taskbar" aria-label="Windows 托盘实际比例示意">
      <span>任务栏实际比例</span>
      <svg class="tray-icon" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="2" y="2" width="28" height="28" rx="7" fill="#263648" />
        <rect x="9" y="6" width="14" height="21" rx="4" fill="#fff" />
        <rect x="11" y="8" width="10" height="15.5" rx="2" fill="#263648" />
        <circle cx="16" cy="25" r="1" fill="#263648" />
        <circle cx="24" cy="24" r="6" fill="#fff" />
        <circle cx="24" cy="24" r="4.1" fill="#34c759" />
      </svg>
    </div>
  </main>
</body>
</html>
